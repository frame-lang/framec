name: matrix-smoke

# Parallel smoke tier of the 17-backend differential matrix — each
# backend is an independent job that compiles AND runs the matrix
# fixtures through that language's real toolchain. Rationale: the Arc-A
# "ALL 17 BACKENDS COMPLETE" failure shipped 16 commits with 12/17
# backends broken because nobody ran the gate. This workflow runs it on
# every framec change. Backends:
#
#   - Python:  dynamic-baseline (cross-target codegen drift surfaces
#              first in dynamic-typed targets)
#   - Rust:    typed-by-value, serde, ownership (type-system bugs)
#   - Java:    JVM, Jackson, reference semantics
#   - Erlang:  gen_statem actor model (most idiomatic divergence)
#   - C++ / C# / Go:  the other typed targets with distinct codegen
#              paths (std::any storage, typed compartments, pointer
#              receivers). Added per FRAMEC #60 — text snapshots are
#              blind to "looks plausible but doesn't compile/run" bugs
#              on the typed targets, and those don't always share a
#              failure mode with Rust/Java. Compile-gating them here
#              catches such bugs on the PR instead of only nightly.
#
# Out of scope: the full 17-backend matrix runs as a nightly (separate
# workflow). The remaining backends (Kotlin/Swift/Dart/C/GDScript/Lua/
# Ruby/PHP/JS/TS) stay nightly-only — GDScript needs Godot, and the rest
# are lower-risk relative to CI minutes per PR.

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  matrix-smoke:
    name: matrix-smoke (${{ matrix.backend }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend: [python, rust, java, erlang, cpp, csharp, go]
    steps:
      - name: Checkout framec
        uses: actions/checkout@v4
        with:
          path: framec

      - name: Checkout framec-test-env
        uses: actions/checkout@v4
        with:
          repository: frame-lang/framec-test-env
          path: framec-test-env
          # The test-env's main branch is the gate target — it
          # carries the matrix fixtures the framec under test has
          # to satisfy.
          ref: main

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: framec

      - name: Build framec (Linux release)
        working-directory: framec
        # The test-env's run.sh refuses a macOS binary. On
        # ubuntu-latest, cargo build produces Linux x86_64 natively;
        # the binary is what test-env expects.
        run: |
          cargo build --release -p framec
          cp target/release/framec ../framec-test-env/docker/framec-linux
          file ../framec-test-env/docker/framec-linux

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Run matrix backend
        working-directory: framec-test-env/docker
        # FRAMEC_BIN is required by docker-compose.yml's volume mount.
        # run.sh's `--build-framec` path is the macOS dev-loop convenience;
        # we skip it because we already have a Linux binary.
        env:
          FRAMEC_BIN: ./framec-linux
        run: |
          bash run.sh ./framec-linux ${{ matrix.backend }} 2>&1 | tee matrix-output.txt

      - name: Assert zero failures
        working-directory: framec-test-env/docker
        # The 17-backend matrix runner emits TAP-formatted lines:
        #   ok N - <test>
        #   not ok N - <test> # <reason>
        # Any `not ok` line means a fixture failed (compile, runtime,
        # or assertion). The "# <reason>" tail covers all three.
        # collect-results.sh aggregates per-language but we only need
        # the per-line check here.
        run: |
          if grep -E '^[a-z_]+-1\s*\|\s*not ok ' matrix-output.txt > /dev/null; then
            echo "::error::Matrix smoke for backend '${{ matrix.backend }}' surfaced failures:"
            grep -E '^[a-z_]+-1\s*\|\s*not ok ' matrix-output.txt | head -50
            exit 1
          fi
          # Backend summary line — runner emits e.g. "# python: 350 passed, 0 failed, 0 skipped"
          grep -E '^[a-z_]+-1\s*\|\s*#\s+[a-z_]+:\s+[0-9]+ passed' matrix-output.txt | tail -1
