[package]
name = "reifier"
version = "0.1.0"
edition = "2021"
description = "The framec reifier: mechanically transforms a native Rust fn into its Frame @@system per the reification calculus. framec, reifying itself."

[[bin]]
name = "reifier"
path = "src/main.rs"

[dependencies]
syn = { version = "2", features = ["full", "extra-traits"] }
proc-macro2 = "1"
quote = "1"

# Detach from the cleanroom workspace root — the reifier is a bootstrap tool, not a
# workspace member (it must build even when the compiler crate is mid-reification).
[workspace]
