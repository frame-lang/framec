title: Frame
description: >-
  Frame is a language for state machines — one specification compiles to 17
  target languages plus Graphviz state diagrams.

# Served at the custom domain https://docs.frame-lang.org (CNAME file in docs/).
# At a domain root, baseurl must be empty so asset/link paths resolve at "/".
url: https://docs.frame-lang.org
baseurl: ""

# Theme is fetched at build time by jekyll-remote-theme (GitHub Pages runs it).
# Pin to the latest released tag once verified, e.g. just-the-docs/just-the-docs@v0.10.1
remote_theme: just-the-docs/just-the-docs

plugins:
  - jekyll-remote-theme
  - jekyll-relative-links      # rewrites foo.md -> foo.html, preserves #anchors
  - jekyll-seo-tag

# jekyll-relative-links
relative_links:
  enabled: true
  collections: false

# just-the-docs
color_scheme: frame-dark       # dark by default; toggle swaps to frame-light
search_enabled: true
search:
  heading_level: 3
  previews: 2
heading_anchors: true
aux_links:
  framec on GitHub:
    - https://github.com/frame-lang/framec
aux_links_new_tab: true

# Playable Frame Arcade — a separate deploy (frame-games repo) at its own
# subdomain. Surfaced as a top-level external nav link that opens in a new
# tab. just-the-docs renders nav_external_links at the bottom of the
# sidebar by theme convention. We tried a docs/games.md redirect page to
# slot it mid-sidebar (between Cookbook and Runtime) but the docs chrome
# wrapped the redirect instead of firing it instantly, so we reverted.
nav_external_links:
  - title: Games
    url: https://games.frame-lang.org
    opens_in_new_tab: true
back_to_top: true
back_to_top_text: "Back to top"

# Published: guides, cookbook, glossary, migration guide, RFCs (index + linked
# pages), articles, and the design/internals docs. Still excluded: contributor
# process docs, the per-language guides (target-language code with Liquid-breaking
# {{ }} sequences — needs {% raw %} wrapping to publish), and the RFC scratch file.
exclude:
  - AGENTS_README.md
  - admin/                  # local symlink into the private frame-admin repo
  - contributing/
  - per_language_guides/
  - Gemfile
  - Gemfile.lock
  - vendor/
  - .bundle/
  - .jekyll-cache/
  - _site/
